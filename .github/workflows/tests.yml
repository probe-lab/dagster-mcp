name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check dagster_mcp/

      - name: Test
        # --extra dev keeps pytest from the project venv. Without it uv can fall
        # through to a pytest elsewhere on PATH, in an environment with a
        # different dagster-graphql, and validate against the wrong schema.
        run: uv run --extra dev --with dagster-graphql==1.13.27 pytest --tb=short

      - name: Test against the oldest supported schema
        # 1.13.6 is the minimum supported Dagster version. The whole suite runs
        # here because conftest checks every document a test sends.
        run: uv run --extra dev --with dagster-graphql==1.13.6 pytest --tb=short
